name: ci

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

# A new push to a pull request cancels that PR's older run, which no longer
# tests the branch and would hold a runner (macOS ones are scarce). Pushes to
# main and tags are never cancelled: each is the record for its commit, and a
# tag run may publish. They get a group of their own (the run id), because a
# shared group would still drop an older run that is waiting for a runner.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only by default; the publish job asks for its OIDC token itself.
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        # macOS runners are scarce: its oldest and newest Python cover the
        # platform, and Ubuntu runs every version.
        exclude:
          - {os: macos-latest, python: "3.12"}
          - {os: macos-latest, python: "3.13"}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
      - name: Install
        run: |
          uv venv --python ${{ matrix.python }} .venv
          uv pip install --python .venv/bin/python -e . --group test
      - name: Lint
        run: .venv/bin/ruff check src tools tests examples
      - name: Unit and conformance
        run: .venv/bin/pytest -m "unit or conform" -q
      - name: Servers and interop
        if: matrix.os == 'ubuntu-latest'
        run: .venv/bin/pytest -m "server or interop" -q
      - name: Bundle behaves like the package
        run: |
          .venv/bin/python tools/bundle.py
          PYTHONPATH=build .venv/bin/python -c "
          import micromcp, sys
          assert micromcp.__file__.startswith(sys.argv[1]), micromcp.__file__
          missing = set(micromcp.__all__) - set(dir(micromcp))
          assert not missing, missing
          " "$PWD/build"
          PYTHONPATH="$PWD/build" .venv/bin/pytest -q

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
      - run: uv build
      - run: uvx twine==7.0.0 check --strict dist/*   # pinned: it runs beside the dist that is published
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: dist
          path: dist/

  publish:
    # Tags alone do not publish: set the repository variable PUBLISH_PYPI=true
    # (Settings > Secrets and variables > Actions > Variables) once the `pypi`
    # environment and PyPI trusted publisher exist, then push the tag.
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    needs: build
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
