name: ci

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: |
          uv venv --python ${{ matrix.python }} .venv
          uv pip install --python .venv/bin/python -e . -e apps --group test
      - name: Lint
        run: .venv/bin/ruff check src tools tests apps
      - name: Unit and conformance
        run: .venv/bin/pytest -m "unit or conform" -q
      - name: Servers and interop
        if: matrix.os == 'ubuntu-latest'
        run: .venv/bin/pytest -m "server or interop" -q
      - name: Bundle behaves like the package
        run: |
          .venv/bin/python tools/bundle.py
          PYTHONPATH=build .venv/bin/python -c "
          import micromcp, sys
          assert micromcp.__file__.startswith(sys.argv[1]), micromcp.__file__
          missing = set(micromcp.__all__) - set(dir(micromcp))
          assert not missing, missing
          " "$PWD/build"
          PYTHONPATH="$PWD/build" .venv/bin/pytest -q

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build --package micromcp
      # micromcp-apps is built and checked, but not part of the published dist/
      - run: uv build --package micromcp-apps --out-dir dist-apps
      - run: uvx twine check --strict dist/* dist-apps/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    # Tags alone do not publish: set the repository variable PUBLISH_PYPI=true
    # (Settings > Secrets and variables > Actions > Variables) once the `pypi`
    # environment and PyPI trusted publisher exist, then push the tag.
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    needs: build
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
