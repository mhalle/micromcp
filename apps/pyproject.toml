[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "micromcp-apps"
dynamic = ["version"]
description = "MCP Apps widgets for micromcp servers: pages, hypermedia fragments, model context, channels, Django views."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "the micromcp authors" }]
keywords = ["mcp", "mcp-apps", "model-context-protocol", "htmx", "widgets"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = ["micromcp"]

[project.optional-dependencies]
django = ["django>=4.2"]

[project.urls]
Homepage = "https://github.com/mhalle/micromcp/tree/main/apps"

[tool.hatch.version]
path = "src/micromcp_apps/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src/micromcp_apps", "tests", "examples", "README.md", "LICENSE", "NOTICE"]

[tool.hatch.build.targets.wheel]
packages = ["src/micromcp_apps"]

[tool.uv.sources]
micromcp = { workspace = true }
